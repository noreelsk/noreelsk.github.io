<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <meta
    name="theme-color"
    content="#050505"
  />

  <meta
    name="description"
    content="Noreel Cup live scores"
  />

  <title>Noreel Cup · Live Scores</title>

  <link
    rel="icon"
    href="assets/noreel.png"
  />

  <link
    rel="stylesheet"
    href="styles.css"
  />
</head>

<body>

  <main class="page-shell">

    <!-- HEADER -->
    <header class="brand-bar">

      <div class="brand-lockup">

        <img
          class="brand-logo"
          src="assets/noreel.png"
          alt="Noreel logo"
        />

        <div>

          <p class="eyebrow">
            LIVE SCORE
          </p>

          <h1 id="competition">
            Noreel Cup
          </h1>

        </div>

      </div>


      <div class="header-live">

        <span
          class="header-live-dot"
          aria-hidden="true"
        ></span>

        LIVE

      </div>

    </header>


    <!-- MAIN MATCH -->
    <section
      id="mainMatch"
      class="main-match-section"
      aria-live="polite"
    ></section>


    <!-- MATCH EVENTS -->
    <section
      id="mainMatchUpdates"
      class="updates-section"
    >

      <div class="section-heading">

        <div>

          <p class="eyebrow">
            MATCH UPDATES
          </p>

          <h2>
            Latest events
          </h2>

        </div>

      </div>


      <ol
        id="eventFeed"
        class="event-feed"
      ></ol>

    </section>


    <!-- ALL MATCHES -->
    <section class="matches-section">

      <div class="section-heading">

        <div>

          <p class="eyebrow">
            NOREEL CUP
          </p>

          <h2>
            All matches
          </h2>

        </div>


        <span class="auto-refresh">
          Updates automatically
        </span>

      </div>


      <div
        id="matches"
        class="matches-grid"
        aria-live="polite"
      ></div>

    </section>


    <!-- FOOTER -->
    <footer class="footer">

      <span>
        NOREEL CUP
      </span>

      <span
        class="footer-mark"
        aria-hidden="true"
      ></span>

      <span id="lastUpdated">
        READY
      </span>

    </footer>

  </main>


  <script
    src="app.js"
    defer
  ></script>

</body>
</html>
